<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS Test</title>

    <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #logs {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 15px;
            height: 300px;
            overflow: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <button id="buyBtn">
        Buy Leads Credit
    </button>

    <div id="logs"></div>

   <script>

const CHECKOUT_URL =
"https://korexbaseteststore.lemonsqueezy.com/checkout/custom/831efa60-d807-4ffb-af69-bafee4fd7dd3?signature=076410ad989cb76d8329984ed6c5f9a1eb4b4e840cff07a2c5b3d4cd522f2c3e";
  //"https://korexbaseteststore.lemonsqueezy.com/checkout/buy/d3e60d9a-180b-44c0-a8c4-4f945282132f?embed=1";
  //"https://korexbaseteststore.lemonsqueezy.com/checkout/custom/6ffbbdc8-42c0-4b98-bf54-593c2facc84c?signature=7ebd4831bc024b309c1a778836e11c86a25a294fc87596149089bff495ec8896";

function log(...args) {
  console.log(...args);
}

function waitForLemon() {
  return new Promise((resolve, reject) => {
    let attempts = 0;
    const maxAttempts = 100;

    const timer = setInterval(() => {
      attempts++;

      if (
        window.LemonSqueezy &&
        window.LemonSqueezy.Setup &&
        window.LemonSqueezy.Url
      ) {
        clearInterval(timer);
        resolve(window.LemonSqueezy);
      }

      if (attempts >= maxAttempts) {
        clearInterval(timer);
        reject(new Error("Lemon SDK initialization timeout"));
      }
    }, 100);
  });
}

async function initializeLemon() {
  try {
    const LemonSqueezy = await waitForLemon();

    log("✅ Lemon SDK Ready");

    LemonSqueezy.Setup({
      eventHandler: (data) => {
        log("EVENT:", data);

        if (data.event === "Checkout.Success") {
          log("🎉 Payment Success");

          setTimeout(() => {
            LemonSqueezy.Url.Close();
          }, 1000);
        }

        if (data.event === "Checkout.Closed") {
          log("🚪 Checkout Closed");
        }
      }
    });

    document
      .getElementById("buyBtn")
      .addEventListener("click", () => {
        LemonSqueezy.Url.Open(CHECKOUT_URL);
      });

  } catch (err) {
    console.error(err);
  }
}

const script = document.createElement("script");
script.src = "https://assets.lemonsqueezy.com/lemon.js";

script.onload = () => {
  log("📦 lemon.js downloaded");
  initializeLemon();
};

script.onerror = () => {
  console.error("❌ Failed to load lemon.js");
};

document.head.appendChild(script);
</script>

</body>
</html>
